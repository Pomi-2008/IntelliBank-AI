spring.application.name=intellibank-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/intellibank;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Optional local GenAI. Install Ollama and pull a model to enable real LLM answers.
app.ai.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ai.model=${OLLAMA_MODEL:llama3.2:3b}
